# minimal clean config for MongoShakeNBake + Atlas (no mongodb+srv)
conf.version = 14
id = ${MSB_ID}
master_quorum = false

# logging
log.level = info
log.dir = ${MSB_LOG_DIR}
log.file = ${MSB_LOG_FILE}
log.flush = false

# ports
full_sync.http_port = 0
incr_sync.http_port = 0
system_profile_port = 0

# sync mode: use "all" for initial full + ongoing incremental
sync_mode = all

# continue on duplicate-key collisions by turning insert into update/upsert
full_sync.executor.insert_on_dup_update = true
full_sync.executor.insert_on_dup_update_mode = replace
incr_sync.executor.insert_on_dup_update = true
incr_sync.executor.insert_on_dup_update_mode = replace
incr_sync.executor.upsert = true

# source (Atlas) - IMPORTANT:
mongo_urls = ${MSB_SOURCE_URL}
mongo_cs_url =
mongo_s_url =
mongo_ssl_root_ca_file = /etc/ssl/certs/ca-certificates.crt
mongo_connect_mode = secondaryPreferred

# target (direct write)
tunnel = direct
tunnel.address = ${MSB_DEST_ADDRESS}
tunnel.mongo_ssl_root_ca_file = /etc/ssl/certs/ca-certificates.crt

# avoid kafka parse issues even when tunnel=direct
tunnel.message = raw
tunnel.kafka.producer.max_message_bytes = 18874368

# checkpoint
checkpoint.storage.url = ${MSB_SOURCE_URL}
checkpoint.storage.db = mongoshakenbake
checkpoint.storage.collection = ckpt_default
checkpoint.storage.url.mongo_ssl_root_ca_file = /etc/ssl/certs/ca-certificates.crt
checkpoint.start_position = 1970-01-01T00:00:00Z

# recommended for Atlas incremental capture
incr_sync.mongo_fetch_method = change_stream
incr_sync.change_stream.watch_full_document = false
incr_sync.worker = 8
incr_sync.tunnel.write_thread = 8

# eventual parity without dropping target collections
full_sync.reconcile.enable = true
full_sync.reconcile.interval = 3600
full_sync.reconcile.delete_batch_size = 1000
full_sync.reconcile.grace_runs = 2
full_sync.reconcile.db = mongoshake_reconcile
full_sync.reconcile.collection = state

# conservative defaults
filter.ddl_enable = false
filter.oplog.gids = false
# namespace filters are literal (not wildcard); separate entries with semicolons
filter.namespace.black = admin;config;local
filter.namespace.white =
transform.namespace =
special.source.db.flag =
skip.nsshardkey.verify =